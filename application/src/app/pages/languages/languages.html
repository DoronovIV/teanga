@if (languages().length) {
<div class="language-list">
    <div class="language-card language-card--add">
        <a routerLink="create">+</a>
    </div>
    @for (language of languages(); track $index) {
    <div class="language-card">
        <div class="language-card__controls">
            <button
                class="control"
                routerLink="update/{{ language.id }}"
                (click)="select(language)"
            >
                <app-pen-icon></app-pen-icon>
            </button>
            <button class="control" (click)="delete(language)">
                <app-trash-bin-icon></app-trash-bin-icon>
            </button>
        </div>
        <div class="language-card__body">
            <a class="language" routerLink="{{ language.id }}" (click)="select(language)">
                <div>{{ language.iso_name }}</div>
            </a>
        </div>
    </div>

    }
</div>
} @else {
<div>Unable to fetch languages</div>
}

<router-outlet />
