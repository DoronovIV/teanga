@let word = word$ | async; @if (word) {
<div class="data">
    <div class="property">
        <div class="property__label">Value</div>
        <div class="property__value">{{ word.value | defaultValue }}</div>
    </div>

    <div class="property">
        <div class="property__label">Translations</div>
        <div class="property__value">
            <ng-container *ngTemplateOutlet="list"></ng-container>
        </div>
    </div>

    <div class="property">
        <div class="property__label">Definition</div>
        <div class="property__value">{{ word.definition | defaultValue }}</div>
    </div>

    <div class="property">
        <div class="property__label">Class</div>
        <div class="property__value">{{ word.class | defaultValue }}</div>
    </div>
</div>
}

<ng-template #list>
    @for (item of word?.translations; track $index) {
    <div class="chip">{{ item }}</div>
    } @empty {
    <div>{{ word?.translations | defaultValue}}</div>
    }
</ng-template>
