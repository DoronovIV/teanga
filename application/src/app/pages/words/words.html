<div class="word-list">
    @if (language()) {
    <a class="word" routerLink="create">+</a>
    } @for (word of words(); track $index) {
    <button class="word" routerLink="{{ word.id }}">{{ word.value }}</button>
    } @empty { @if (!language()) {
    <div class="empty-message">Please select language to start.</div>
    } @else {
    <div class="empty-message">Unable to fetch words.</div>
    } }
</div>
